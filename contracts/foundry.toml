# Foundry configuration for the Injenium (灵枢) Skill Market contract (spec §6, M5).
#
# Deploy to the Injective EVM testnet and verify on Blockscout, e.g.:
#
#   export INJECTIVE_PRIVATE_KEY=0x...            # faucet-funded test key
#   forge create contracts/src/Market.sol:Market \
#       --rpc-url injectiveTestnet \
#       --private-key $INJECTIVE_PRIVATE_KEY \
#       --broadcast \
#       --verify --verifier blockscout \
#       --verifier-url https://testnet.blockscout.injective.network/api
#
# Then point the agent at it:
#   dimos run injenium.agentic \
#       --marketskillcontainer-chain-backend injective \
#       --marketskillcontainer-market-contract 0x<deployed address>

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# EVM Chain IDs: testnet 1439, mainnet 1776 (see injenium/config.py).
[rpc_endpoints]
injectiveTestnet = "https://k8s.testnet.json-rpc.injective.network/"
injectiveMainnet = "https://sentry.evm-rpc.injective.network/"

# Blockscout verification endpoints (no API key required for the testnet).
[etherscan]
injectiveTestnet = { key = "", url = "https://testnet.blockscout.injective.network/api", chain = 1439 }
injectiveMainnet = { key = "", url = "https://blockscout.injective.network/api", chain = 1776 }
